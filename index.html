<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Première scène Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <canvas class="webgl"></canvas>
    <div id="blood-overlay"></div>
    <div id="landing-page">
    <div class="content">
        <div id="story-subtitle">Appuyez sur n'importe quelle touche pour approcher...</div>
        
        <div id="main-ui-reveal" style="display: none; opacity: 0;">
            <h1 class="horror-title">LE GRENIER</h1>
            <p class="subtitle">20 objets. 10 minutes. Une seule issue.</p>
            <button id="start-btn">VIVRE OU MOURIR. À TOI DE CHOISIR.</button>
        </div>
    </div>
</div>
    <div id="sanity-wrapper">
        <div id="sanity-label">SANTÉ MENTALE</div>
        <div id="sanity-gauge">
            <div id="sanity-fill"></div>
        </div>
    </div>
    <div id="ui-container">
        <div id="timer-display">15:00</div>
    </div>
    <div id="progression-container">
        <span id="objets-trouves">0</span> / 25 OBJETS EXORCISÉS
    </div>
    <div id="pause-menu" style="display: none;">
    <div class="pause-content">
        <h2 class="horror-title">PARTIE EN PAUSE</h2>
        <button id="resume-btn">REPRENDRE</button>
        <button id="home-btn">MENU PRINCIPAL</button>
    </div>
</div>
    <div id="guess-overlay" style="display:none;">
    <div class="ouija-container">
        <h2 id="ouija-title">COMMUNIEZ AVEC L'ESPRIT...</h2>
        
        <!-- Le mot qui se dessine -->
        <div id="word-display"></div>

        <div class="ouija-board">
            <!-- La planchette qui bouge -->
            <div id="planchette">
                <div class="lens"></div>
            </div>
            
            <!-- Les lettres seront générées ici par le JS -->
            <div id="letters-arc"></div>
            <button id="space-btn" onclick="ajouterEspace()">ESPACE</button>
             <button class="exit-btn" onclick="fermerOuija()">QUITTER</button>
        </div>

        <div class="ouija-actions">
            <button id="btn-non" onclick="effacerDerniereLettre()">NON</button>
            <button id="confirm-ouija">OUI</button>
        </div>
    </div>
    <div id="movie-info-card" style="display:none;">
    <div id="card-content"></div>
    <button onclick="retourAuJeu()">CONTINUER L'EXPLORATION</button>
</div>
</div>
<div id="interaction-prompt" style="display: none;">
    Appuyez sur <span style="color: #8b0000; font-weight: bold;">[E]</span> pour examiner
</div>
<div id="game-over-screen" style="display:none;">
    <div class="death-content">
        <h1>VOTRE ESPRIT A SOMBRÉ</h1>
        <p>Le grenier a réclamé une nouvelle âme.</p>
        <button onclick="location.reload()">TENTER UNE NOUVELLE EXORCISATION</button>
    </div>
</div>
    <script type="module" src="/main.js"></script>
</body>
</html>
